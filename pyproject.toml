[build-system]
requires = ["maturin>=1.10,<2.0"]
build-backend = "maturin"

[project]
name = "evalkeel"
dynamic = ["version"]
description = "Zero-Python Rust ML model-agnostic backtest, calibration, conformal coverage, fairness parity & HTML Model Card CLI."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
authors = [{ name = "Robert Guss" }]
keywords = ["ml", "evaluation", "calibration", "fairness", "cli", "keel"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/robertguss/evalkeel"
Repository = "https://github.com/robertguss/evalkeel"
Issues = "https://github.com/robertguss/evalkeel/issues"

[tool.maturin]
bindings = "bin"
compatibility = "pypi"
strip = true
